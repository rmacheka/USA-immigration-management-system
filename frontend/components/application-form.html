<!-- Application Form Component -->
<div class="application-form-container">
    <h2>New Immigration Application</h2>
    <form id="immigrationForm" class="application-form">
        <!-- Personal Information -->
        <section class="form-section">
            <h3>Personal Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender">
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Contact Information -->
        <section class="form-section">
            <h3>Contact Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>
                <div class="form-group">
                    <label for="address">Current Address *</label>
                    <textarea id="address" name="address" required></textarea>
                </div>
                <div class="form-group">
                    <label for="country">Country of Residence *</label>
                    <select id="country" name="country" required>
                        <option value="">Select Country</option>
                        <!-- Countries will be populated dynamically -->
                    </select>
                </div>
            </div>
        </section>

        <!-- Visa Information -->
        <section class="form-section">
            <h3>Visa Information</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="visaType">Visa Type *</label>
                    <select id="visaType" name="visaType" required>
                        <option value="">Select Visa Type</option>
                        <option value="work">Work Visa</option>
                        <option value="student">Student Visa</option>
                        <option value="tourist">Tourist Visa</option>
                        <option value="family">Family Visa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="purpose">Purpose of Visit *</label>
                    <textarea id="purpose" name="purpose" required></textarea>
                </div>
                <div class="form-group">
                    <label for="duration">Intended Duration *</label>
                    <select id="duration" name="duration" required>
                        <option value="">Select Duration</option>
                        <option value="30">30 days</option>
                        <option value="90">90 days</option>
                        <option value="180">180 days</option>
                        <option value="365">1 year</option>
                        <option value="730">2 years</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Supporting Documents -->
        <section class="form-section">
            <h3>Supporting Documents</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="passport">Passport Copy *</label>
                    <input type="file" id="passport" name="passport" accept=".pdf,.jpg,.png" required>
                </div>
                <div class="form-group">
                    <label for="photo">Passport Photo *</label>
                    <input type="file" id="photo" name="photo" accept=".jpg,.png" required>
                </div>
                <div class="form-group">
                    <label for="additionalDocs">Additional Documents</label>
                    <input type="file" id="additionalDocs" name="additionalDocs" multiple>
                </div>
            </div>
        </section>

        <!-- Declaration -->
        <section class="form-section">
            <div class="form-group">
                <input type="checkbox" id="declaration" name="declaration" required>
                <label for="declaration">I declare that all information provided is true and accurate *</label>
            </div>
        </section>

        <!-- Form Actions -->
        <div class="form-actions">
            <button type="button" class="btn-secondary" id="saveDraft">Save as Draft</button>
            <button type="submit" class="btn-primary">Submit Application</button>
        </div>
    </form>
</div>
